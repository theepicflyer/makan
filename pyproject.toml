[project]
name = "makan"
version = "0.1.0"
description = "Self-hosted calorie and macro tracker with a Claude logging agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.17.0",
    "authlib>=1.9.1",
    "fastapi>=0.156.8",
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/makan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
