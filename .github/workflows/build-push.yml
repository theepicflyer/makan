name: Build and Push (reusable)

# Reusable build/push of the image to GHCR, called by release.yml. The image
# carries the commit it was built from in the org.opencontainers.image.revision
# label; the deployer checks it against the release tag before deploying.

on:
  workflow_call:
    inputs:
      image_tags:
        description: 'Newline-delimited tag list'
        required: true
        type: string
      version:
        description: 'Version recorded in the image labels'
        required: true
        type: string
      ref:
        description: 'Git ref to checkout and build'
        required: false
        default: 'main'
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ inputs.image_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          platforms: linux/amd64
          cache-from: type=gha,scope=build-cache
          cache-to: type=gha,mode=max,scope=build-cache,ignore-error=true
